flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/general/logo.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/langs/
    - assets/islamics_offline/
    # - assets/langs/en.json
    #- assets/langs/fr.json
    - assets/images/onboarding/
    - assets/images/start_view/
    - assets/images/compass_view/
    - assets/images/competition_view/
    - assets/images/azkar_view/
    - assets/images/azan_view_v2/
    - assets/images/slider_view/
    - assets/images/ramadan_view/
    - assets/images/more/

    - assets/databases/azkar_database/
    - assets/databases/quran_database/
    - assets/images/azan_view/
    - assets/images/setting_view/
    - assets/images/general/
    - assets/images/splash_view/
    - assets/images/
    - assets/images/quran_view/
    - assets/images/sebha_view/
    - assets/images/home_view/
    - assets/audio/
    - assets/audio/questions/
    - assets/images/islamic_icons/
    - assets/images/islamic_offline_icons/
  #    - assets/audio/azkar/

  fonts:
    - family: arabic
      fonts:
        - asset: assets/fonts/ar_light.ttf
          weight: 300
        - asset: assets/fonts/ar_regular.ttf
          weight: 400
        - asset: assets/fonts/ar_bold.ttf
          weight: 700
        - asset: assets/fonts/ar_extra_bold.ttf
          weight: 900

    - family: quran
      fonts:
        - asset: assets/fonts/quran_font.ttf
