    - assets/images/splash_view/
    - assets/images/
    - assets/images/quran_view/
    - assets/images/sebha_view/
    - assets/images/home_view/
    - assets/audio/
    - assets/audio/questions/
#    - assets/audio/azkar/

  fonts:
    - family: arabic
      fonts:
        - asset: assets/fonts/ar_light.ttf
          weight: 300
        - asset: assets/fonts/ar_regular.ttf
          weight: 400
        - asset: assets/fonts/ar_bold.ttf
          weight: 700
        - asset: assets/fonts/ar_extra_bold.ttf
